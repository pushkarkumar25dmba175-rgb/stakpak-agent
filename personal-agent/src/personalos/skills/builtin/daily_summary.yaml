name: daily_summary
description: Write a short Markdown note listing what changed in a folder today.
version: 1
created_by: user
inputs:
  folder:
    type: string
    description: The folder to look at.
    required: true
  output:
    type: string
    description: Where to write the summary.
    required: false
    default: "~/PersonalOS/reports/daily-summary.md"
permissions:
  - filesystem.read
  - filesystem.write
max_risk_level: 1
tags: [reporting, daily]
steps:
  - id: scan
    description: List the folder's contents
    tool: filesystem
    operation: list
    arguments:
      path: "{{ inputs.folder }}"
      recursive: true
      limit: 500
    verification:
      kind: count_at_least
      field: count
      minimum: 0
  - id: write
    description: Write the summary note
    tool: filesystem
    operation: write
    arguments:
      path: "{{ inputs.output }}"
      content: |
        # Daily summary

        Folder: {{ inputs.folder }}
        Entries: {{ steps.scan.data.count }}

        Generated by PersonalOS.
    depends_on: [scan]
    verification:
      kind: path_nonempty
