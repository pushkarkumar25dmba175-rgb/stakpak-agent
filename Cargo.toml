[package]
name = "stakpak-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An autonomous DevOps agent for your terminal, with secret redaction, reversible file writes, and resumable sessions"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pushkarkumar25dmba175-rgb/stakpak-agent"
keywords = ["devops", "agent", "llm", "infrastructure", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "stakpak_agent"
path = "src/lib.rs"

[[bin]]
name = "stakpak"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
dirs = "7.0.0"
ignore = "0.4.33"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "charset", "http2", "rustls", "system-proxy"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellwords = "1.1.0"
similar = "3.2.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs", "signal"] }
toml = "1.1.5"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "macros", "io-util"] }
